name: Unity tests
on:
  workflow_dispatch:
  push:
    branches: [feat/substance-ontology]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-tests.yml'
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-tests.yml'

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [EditMode, PlayMode]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity activation configuration exists
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Unity activation is not configured. See docs/UNITY_CI_SETUP.md; Unity tests did not run."
            exit 1
          fi
      - name: Unity test suite
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.5f1
          testMode: ${{ matrix.mode }}
          artifactsPath: artifacts/${{ matrix.mode }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.mode }}-results
          path: artifacts
          if-no-files-found: ignore
